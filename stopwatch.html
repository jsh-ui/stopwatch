<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>달팽이 스탑워치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #3b4a3a;
    --muted: #7d8a7b;
    --card: rgba(255, 255, 255, 0.72);
    --line: rgba(59, 74, 58, 0.12);
    --start: #5bb974;
    --stop: #f07a7a;
    --neutral: rgba(255, 255, 255, 0.85);
    --best: #3c9d57;
    --worst: #e05a5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(#a9ddff, #e8f8ff 55%, #a6dc8a 55%);
    color: var(--text);
    font-family: "Jua", system-ui, "Malgun Gothic", sans-serif;
    overflow: hidden;
  }
  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    display: block;
  }
  .wrap {
    position: relative;
    z-index: 1;
    width: calc(100% - 32px);
    max-width: 420px;
    margin: 28px auto 0;
    padding: 20px 22px 18px;
    background: var(--card);
    border-radius: 28px;
    box-shadow: 0 10px 30px rgba(60, 110, 80, 0.18);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .display {
    font-variant-numeric: tabular-nums;
    font-size: clamp(44px, 14vw, 68px);
    text-align: center;
    letter-spacing: 1px;
    margin: 4px 0 18px;
  }
  .display .ms { color: var(--muted); }
  .buttons { display: flex; gap: 14px; }
  button {
    flex: 1;
    height: 56px;
    border: none;
    border-radius: 28px;
    font: inherit;
    font-size: 20px;
    cursor: pointer;
    color: var(--text);
    background: var(--neutral);
    box-shadow: 0 3px 0 rgba(0, 0, 0, 0.08);
    transition: filter .15s, transform .05s;
  }
  button:hover:not(:disabled) { filter: brightness(1.06); }
  button:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
  button:disabled { opacity: .5; cursor: default; }
  #toggle.start { background: var(--start); color: #fff; }
  #toggle.stop  { background: var(--stop);  color: #fff; }
  .hint { text-align: center; color: var(--muted); font-size: 13px; margin: 12px 0 8px; }
  ul {
    list-style: none;
    padding: 0;
    margin: 0;
    max-height: 22vh;
    overflow-y: auto;
  }
  li {
    display: flex;
    justify-content: space-between;
    padding: 8px 4px;
    border-top: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  li .total { color: var(--muted); font-size: 14px; margin-left: auto; margin-right: 16px; }
  li.best  { color: var(--best); }
  li.worst { color: var(--worst); }
  .tag {
    position: fixed;
    z-index: 3;
    transform: translate(-50%, -100%);
    margin-top: -8px;
    padding: 4px 14px;
    border: 3px solid;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.95);
    color: var(--text);
    font-size: 18px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    pointer-events: none;
    box-shadow: 0 3px 8px rgba(60, 110, 80, 0.25);
  }
  .tag::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -9px;
    margin-left: -6px;
    border: 6px solid transparent;
    border-top-color: rgba(255, 255, 255, 0.95);
    border-bottom: 0;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="wrap">
  <div class="display" id="display">00:00<span class="ms">.00</span></div>
  <div class="buttons">
    <button id="lap" disabled>기다려</button>
    <button id="toggle" class="start">출발</button>
  </div>
  <div class="hint">Space: 출발/정지 · L: 기다려 · R: 리셋</div>
  <ul id="laps"></ul>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ───────────── 3D 배경: 달팽이 경주 ───────────── */
(() => {
  if (!window.THREE) return; // 오프라인이면 CSS 배경만 표시

  const canvas = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#bfe6ff');
  scene.fog = new THREE.Fog('#bfe6ff', 110, 320);

  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 6000);

  // 조명
  scene.add(new THREE.HemisphereLight('#ffffff', '#6aa84f', 0.5));
  const sun = new THREE.DirectionalLight('#fff6e0', 0.65);
  sun.position.set(12, 30, 18);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -32, right: 32, top: 24, bottom: -24, near: 1, far: 90 });
  scene.add(sun, sun.target);

  const mat = (color, opts = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.7, ...opts });
  const shadowed = m => { m.castShadow = true; m.receiveShadow = true; return m; };

  /* ── 트랙 ── */
  const LANES = 5, LANE_W = 4;
  const LINE_X = -14;                  // 출발선 위치
  const START_X = LINE_X - 2.6;        // 달팽이 몸 기준 대기 위치 (코가 출발선에 닿음)
  const X_MIN = -100, X_MAX = 900;     // 풍경이 깔려 있는 범위
  const SPAN = X_MAX - X_MIN, MID = (X_MAX + X_MIN) / 2;
  const laneZ = i => (i - (LANES - 1) / 2) * LANE_W;

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), mat('#86c866'));
  ground.rotation.x = -Math.PI / 2;
  ground.position.x = MID;
  ground.receiveShadow = true;
  scene.add(ground);

  for (let i = 0; i < LANES; i++) {
    const lane = new THREE.Mesh(
      new THREE.PlaneGeometry(SPAN, LANE_W),
      mat(i % 2 ? '#7cc95e' : '#8fd472')
    );
    lane.rotation.x = -Math.PI / 2;
    lane.position.set(MID, 0.01, laneZ(i));
    lane.receiveShadow = true;
    scene.add(lane);
  }
  const whiteMat = mat('#ffffff');
  for (let i = 0; i <= LANES; i++) {
    const line = new THREE.Mesh(new THREE.PlaneGeometry(SPAN, 0.12), whiteMat);
    line.rotation.x = -Math.PI / 2;
    line.position.set(MID, 0.02, (i - LANES / 2) * LANE_W);
    line.receiveShadow = true;
    scene.add(line);
  }
  // 출발선 (체크무늬)
  const gridCanvas = document.createElement('canvas');
  gridCanvas.width = gridCanvas.height = 16;
  const gctx = gridCanvas.getContext('2d');
  gctx.fillStyle = '#fff'; gctx.fillRect(0, 0, 16, 16);
  gctx.fillStyle = '#333'; gctx.fillRect(0, 0, 8, 8); gctx.fillRect(8, 8, 8, 8);
  const gridTex = new THREE.CanvasTexture(gridCanvas);
  gridTex.wrapS = gridTex.wrapT = THREE.RepeatWrapping;
  gridTex.magFilter = THREE.NearestFilter;
  gridTex.repeat.set(1, 10);
  const startLine = new THREE.Mesh(
    new THREE.PlaneGeometry(1, LANES * LANE_W),
    new THREE.MeshStandardMaterial({ map: gridTex, roughness: 0.8 })
  );
  startLine.rotation.x = -Math.PI / 2;
  startLine.position.set(LINE_X + 0.5, 0.025, 0);
  startLine.receiveShadow = true;
  scene.add(startLine);

  /* ── 풍경 (멀리까지 깔리므로 InstancedMesh로 가볍게) ── */
  const rand = (a, b) => a + Math.random() * (b - a);
  const dummy = new THREE.Object3D();
  const tint = new THREE.Color();

  function instanced(geo, material, count, place, colorOf) {
    const m = new THREE.InstancedMesh(geo, material, count);
    for (let i = 0; i < count; i++) {
      dummy.position.set(0, 0, 0); dummy.rotation.set(0, 0, 0); dummy.scale.set(1, 1, 1);
      place(dummy, i);
      dummy.updateMatrix();
      m.setMatrixAt(i, dummy.matrix);
      if (colorOf) m.setColorAt(i, tint.set(colorOf(i)));
    }
    m.castShadow = true;
    m.receiveShadow = true;
    scene.add(m);
    return m;
  }

  // 뒤쪽 언덕
  const hillColors = ['#b6e59a', '#a9dd8b', '#bfe9a6'];
  for (let x = X_MIN, i = 0; x < X_MAX; x += 110, i++) {
    const r = rand(40, 60);
    const hill = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 16), mat(hillColors[i % 3]));
    hill.scale.y = 0.45;
    hill.position.set(x + rand(-20, 20), -r * 0.1, rand(-135, -110));
    scene.add(hill);
  }

  // 둥근 나무
  const TREES = Array.from({ length: 170 }, (_, i) => ({
    x: X_MIN + i * (SPAN / 170) + rand(-2, 2), z: rand(-26, -16), h: rand(2, 3.5), s: rand(0.8, 1.2),
  }));
  const leafColors = ['#6cc46a', '#7fd27a', '#5fb560'];
  instanced(new THREE.CylinderGeometry(0.35, 0.45, 1, 10), mat('#b07a4f'), TREES.length, (d, i) => {
    const t = TREES[i];
    d.position.set(t.x, t.h * t.s / 2, t.z);
    d.scale.set(t.s, t.h * t.s, t.s);
  });
  [[0, 1.4, 0, 2], [0.9, 0.8, 0.3, 1.4], [-0.9, 0.9, -0.2, 1.5]].forEach(([ox, oy, oz, r]) => {
    instanced(new THREE.SphereGeometry(1, 16, 12), mat('#ffffff'), TREES.length, (d, i) => {
      const t = TREES[i];
      d.position.set(t.x + ox * t.s, (t.h + oy) * t.s, t.z + oz * t.s);
      d.scale.setScalar(r * t.s);
    }, i => leafColors[i % 3]);
  });

  // 버섯
  const SHROOMS = Array.from({ length: 90 }, (_, i) => ({
    x: rand(X_MIN, X_MAX), z: rand(12.5, 17) * (i % 2 ? 1 : -1), s: rand(0.8, 1.4),
  }));
  instanced(new THREE.CylinderGeometry(0.25, 0.32, 0.8, 12), mat('#fff4e6'), SHROOMS.length, (d, i) => {
    const m = SHROOMS[i];
    d.position.set(m.x, 0.4 * m.s, m.z); d.scale.setScalar(m.s);
  });
  instanced(new THREE.SphereGeometry(0.7, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), mat('#ff6f6f', { roughness: 0.5 }), SHROOMS.length, (d, i) => {
    const m = SHROOMS[i];
    d.position.set(m.x, 0.75 * m.s, m.z); d.scale.setScalar(m.s);
  });
  instanced(new THREE.SphereGeometry(0.1, 8, 6), whiteMat, SHROOMS.length * 5, (d, i) => {
    const m = SHROOMS[Math.floor(i / 5)], a = ((i % 5) / 5) * Math.PI * 2;
    d.position.set(m.x + Math.cos(a) * 0.45 * m.s, 1.2 * m.s, m.z + Math.sin(a) * 0.45 * m.s);
    d.scale.setScalar(m.s);
  });

  // 꽃
  const FLOWERS = Array.from({ length: 900 }, (_, i) => ({
    x: rand(X_MIN, X_MAX), z: (i % 2 ? 1 : -1) * rand(10.8, 22),
  }));
  const petalColors = ['#ffffff', '#ffd1dc', '#fff3a8', '#e1d0ff'];
  instanced(new THREE.CylinderGeometry(0.04, 0.04, 0.6, 6), mat('#4fa34f'), FLOWERS.length, (d, i) => {
    d.position.set(FLOWERS[i].x, 0.3, FLOWERS[i].z);
  });
  instanced(new THREE.SphereGeometry(0.28, 10, 8), mat('#ffffff'), FLOWERS.length, (d, i) => {
    d.position.set(FLOWERS[i].x, 0.64, FLOWERS[i].z);
    d.scale.set(1, 0.6, 1);
  }, i => petalColors[i % petalColors.length]);

  // 구름
  const cloudMat = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 1 });
  const clouds = [];
  for (let i = 0; i < 16; i++) {
    const c = new THREE.Group();
    [[0, 0, 0, 3], [3, 0.8, 0, 3.6], [6.2, 0, 0, 2.8], [3, -0.6, 1.5, 2.6]].forEach(([x, y, z, r]) => {
      const puff = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), cloudMat);
      puff.position.set(x, y, z);
      c.add(puff);
    });
    c.position.set(rand(-150, 150), rand(26, 42), rand(-90, -50));
    c.userData.v = rand(1.2, 3);
    clouds.push(c);
    scene.add(c);
  }


  /* ── 달팽이 ── */
  const SNAILS = [
    { name: '핑크',  shell: '#ff9eb5', line: '#d9607f' },
    { name: '주황',  shell: '#ffc76b', line: '#d98e26' },
    { name: '파랑',  shell: '#8fcbff', line: '#4a8fd1' },
    { name: '보라',  shell: '#c6a8ff', line: '#8a63d8' },
    { name: '초록',  shell: '#94e0aa', line: '#4aa86a' },
  ];
  const bodyMat = mat('#ffe0b0', { roughness: 0.55 });
  const eyeWhite = mat('#ffffff', { roughness: 0.3 });
  const pupilMat = mat('#222222', { roughness: 0.3 });
  const cheekMat = mat('#ff9aac');
  const smileMat = mat('#9a5a2e');
  const trailMat = new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.5 });

  function makeShell(color, lineColor) {
    const g = new THREE.Group();
    const R = 1.15, ZS = 0.78;
    const shell = shadowed(new THREE.Mesh(
      new THREE.SphereGeometry(R, 32, 24),
      mat(color, { roughness: 0.35 })
    ));
    shell.scale.z = ZS;
    g.add(shell);
    const lineMat = mat(lineColor, { roughness: 0.4 });
    [1, -1].forEach(side => {
      const pts = [];
      for (let a = 0; a < Math.PI * 4.2; a += 0.12) {
        const r = R * 0.92 * (1 - a / (Math.PI * 4.6));
        const x = Math.cos(a) * r, y = Math.sin(a) * r;
        const z = side * (ZS * Math.sqrt(Math.max(0, R * R - r * r)) + 0.02);
        pts.push(new THREE.Vector3(x, y, z));
      }
      const tube = new THREE.Mesh(
        new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 120, 0.06, 6, false),
        lineMat
      );
      g.add(tube);
    });
    return g;
  }

  function makeSnail(info, lane) {
    const root = new THREE.Group();
    const body = shadowed(new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16), bodyMat));
    body.scale.set(1.9, 0.42, 0.62);
    body.position.set(0, 0.42, 0);
    root.add(body);

    const head = new THREE.Group();
    head.position.set(1.6, 0.95, 0);
    const headBall = shadowed(new THREE.Mesh(new THREE.SphereGeometry(0.58, 20, 16), bodyMat));
    head.add(headBall);

    const stalks = [];
    [1, -1].forEach(side => {
      const st = new THREE.Group();
      st.position.set(0.05, 0.35, side * 0.22);
      st.rotation.set(side * 0.28, 0, -0.3);
      const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 1, 8), bodyMat);
      stick.position.y = 0.5;
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 12), eyeWhite);
      eye.position.y = 1.05;
      const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 8), pupilMat);
      pupil.position.set(0.15, 1.07, side * 0.1);
      st.add(stick, eye, pupil);
      head.add(st);
      stalks.push(st);
    });
    [1, -1].forEach(side => {
      const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.12, 10, 8), cheekMat);
      cheek.scale.z = 0.4;
      cheek.position.set(0.25, -0.1, side * 0.5);
      head.add(cheek);
      const smile = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.03, 6, 16, Math.PI), smileMat);
      smile.rotation.set(0, side > 0 ? 0 : Math.PI, Math.PI);
      smile.position.set(0.38, -0.05, side * 0.42);
      head.add(smile);
    });
    root.add(head);

    const shell = makeShell(info.shell, info.line);
    shell.position.set(-0.35, 1.5, 0);
    shell.rotation.z = 0.15;
    root.add(shell);


    const trail = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.7), trailMat);
    trail.rotation.x = -Math.PI / 2;
    trail.position.set(0, 0.03, laneZ(lane));
    trail.visible = false;
    scene.add(trail);

    // 머리 위 시간 말풍선 (화면 위에 겹쳐 그려서 스탑워치 카드에 가려지지 않음)
    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.style.borderColor = info.line;
    tag.style.display = 'none';
    document.body.appendChild(tag);
    const label = {
      set visible(v) { tag.style.display = v ? 'block' : 'none'; },
      get visible() { return tag.style.display !== 'none'; },
    };

    root.position.z = laneZ(lane);
    scene.add(root);
    return { info, lane, root, body, head, shell, stalks, trail,
             label, tag, frozen: false,
             p: 0, phase: 0, base: 0, boost: 1, nextChange: 0 };
  }

  function setLabel(s, text) {
    s.tag.textContent = text;
  }

  const snails = SNAILS.map(makeSnail);

  /* ── 달리기 로직 (결승선 없이 끝없이 달리고, 카메라가 점점 물러남) ── */
  let time = 0;
  let started = false;                 // 출발 전에는 출발선에서 대기
  const W_MIN = 22, W_MAX = 400;       // 카메라가 담는 가로 반폭의 최소/최대

  function newRun() {
    started = false;
    snails.forEach(s => {
      s.x = START_X;
      s.phase = Math.random() * Math.PI * 2;
      s.speed = 36 / (14 + Math.random() * 8);      // 초당 이동 거리
      s.boost = 1;
      s.nextChange = Math.random() * 2;
      s.frozen = false;
      s.label.visible = false;
    });
  }

  // 스탑워치의 '기다려'에서 호출: 아직 달리는 달팽이 하나를 골라 멈추고 시간을 띄움
  window.snailRace = {
    freezeRandom(text) {
      const free = snails.filter(s => !s.frozen);
      if (!free.length) return;
      // 가장 뒤처진(늦게 가는) 달팽이부터 멈춤. 위치가 같으면 그중 랜덤
      const last = Math.min(...free.map(s => s.x));
      const pool = free.filter(s => s.x - last < 0.01);
      const s = pool[Math.floor(Math.random() * pool.length)];
      s.frozen = true;
      setLabel(s, text);
      s.label.visible = true;
    },
    start() { started = true; },
    reset() { newRun(); },
  };

  // 카메라가 담을 영역 (달팽이 전체가 들어오도록 계산)
  let viewCx = 0, viewW = W_MIN, viewInit = false;
  function targetView() {
    let lo = Infinity, hi = -Infinity;
    snails.forEach(s => { lo = Math.min(lo, s.x - 3.5); hi = Math.max(hi, s.x + 4); });
    lo = Math.min(lo - 5, -W_MIN);          // 뒤쪽 여유
    hi = Math.max(hi + 8, W_MIN);           // 앞쪽 여유
    const w = Math.min(W_MAX, (hi - lo) / 2);
    const cx = (hi - lo) / 2 > W_MAX ? lo + w : (hi + lo) / 2;   // 한계를 넘으면 가장 뒤쪽부터 담음
    return { cx, w };
  }

  function update(dt) {
    snails.forEach(s => {
      if (started && !s.frozen) {
        s.nextChange -= dt;
        if (s.nextChange <= 0) {
          s.boost = 0.6 + Math.random() * 0.9;   // 가끔 힘내거나 쉬어가기
          s.nextChange = 1 + Math.random() * 2;
        }
        s.phase += dt * 4 * s.boost;
        const pulse = 0.4 + 0.6 * Math.max(0, Math.sin(s.phase));
        s.x += s.speed * s.boost * pulse * 1.4 * dt;
      }

      // 달팽이 모양 갱신
      const stretch = (Math.sin(s.phase) + 1) / 2;
      s.root.position.x = s.x;
      s.body.scale.x = 1.8 + stretch * 0.25;
      s.body.position.x = stretch * 0.15;
      s.head.position.x = 1.6 + stretch * 0.4;
      s.shell.position.y = 1.5 + Math.sin(s.phase) * 0.06;
      s.stalks.forEach((st, i) => {
        st.rotation.z = -0.3 + Math.sin(time * 3 + i * 1.7 + s.lane) * 0.12;
      });
      const len = s.x - START_X;
      s.trail.visible = len > 0.05;
      s.trail.scale.x = Math.max(0.01, len);
      s.trail.position.x = START_X - 1.6 + len / 2;
    });

    // 카메라 영역을 부드럽게 따라가기
    const tv = targetView();
    const k = viewInit ? 1 - Math.exp(-dt * 2.5) : 1;
    viewInit = true;
    viewCx += (tv.cx - viewCx) * k;
    viewW += (tv.w - viewW) * k;

    // 멀어질수록 달팽이를 키워서 계속 보이게
    const zoom = viewW / W_MIN;
    const r = Math.min(Math.sqrt(zoom), 1.8);          // 달팽이 크기
    snails.forEach(s => { s.root.scale.setScalar(r); s.size = r; });

    // 구름은 카메라 영역 안에서 계속 흐르도록
    const range = Math.max(150, viewW * 3);
    clouds.forEach(c => {
      c.position.x += c.userData.v * dt;
      if (c.position.x > viewCx + range) c.position.x -= 2 * range;
      else if (c.position.x < viewCx - range) c.position.x += 2 * range;
      c.scale.setScalar(Math.max(1, zoom * 0.6));
    });
  }

  /* ── 카메라 ── */
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }

  function placeCamera() {
    const halfFov = THREE.MathUtils.degToRad(camera.fov / 2);
    const camDist = Math.max(26, viewW / (Math.tan(halfFov) * camera.aspect));
    const sway = Math.sin(time * 0.15) * 0.08;
    const dir = new THREE.Vector3(Math.sin(sway) * 0.8, 0.42, Math.cos(sway)).normalize();
    camera.position.copy(dir.multiplyScalar(camDist)).add(new THREE.Vector3(viewCx, 0, 0));
    camera.lookAt(viewCx, camDist * 0.16, 0);

    // 안개와 그림자 영역도 화면 크기에 맞춰 조정
    scene.fog.near = camDist * 2.5;
    scene.fog.far = camDist * 8;
    const kk = Math.max(1, viewW / W_MIN);
    sun.target.position.set(viewCx, 0, 0);
    sun.position.set(viewCx + 12 * kk, 30 * kk, 18 * kk);
    const sc = sun.shadow.camera;
    sc.left = -viewW * 1.3; sc.right = viewW * 1.3;
    sc.top = 30 * kk; sc.bottom = -30 * kk;
    sc.near = 1; sc.far = 120 * kk;
    sc.updateProjectionMatrix();
  }

  // 멈춘 달팽이 머리 위 3D 좌표를 화면 좌표로 바꿔 말풍선을 놓음
  const tagPos = new THREE.Vector3();
  function placeTags() {
    camera.updateMatrixWorld();
    const w = window.innerWidth, h = window.innerHeight;
    snails.forEach(s => {
      if (!s.label.visible) return;
      const r = s.size || 1;
      tagPos.set(s.x + 1.9 * r, 4 * r + 0.4, laneZ(s.lane)).project(camera);
      s.tag.style.left = ((tagPos.x * 0.5 + 0.5) * w) + 'px';
      s.tag.style.top = ((-tagPos.y * 0.5 + 0.5) * h) + 'px';
    });
  }

  const clock = new THREE.Clock();
  function frame() {
    const dt = Math.min(0.25, clock.getDelta());
    time += dt;
    update(dt);
    placeCamera();
    placeTags();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  newRun();
  frame();
})();

/* ───────────── 스탑워치 ───────────── */
(() => {
  const display = document.getElementById('display');
  const toggleBtn = document.getElementById('toggle');
  const lapBtn = document.getElementById('lap');
  const lapList = document.getElementById('laps');

  let running = false;
  let startTime = 0;
  let elapsed = 0;
  let laps = [];
  let lastLapTotal = 0;
  let rafId = null;

  const now = () => running ? elapsed + (performance.now() - startTime) : elapsed;

  function format(ms) {
    const cs = Math.floor(ms / 10) % 100;
    const s = Math.floor(ms / 1000) % 60;
    const m = Math.floor(ms / 60000) % 60;
    const h = Math.floor(ms / 3600000);
    const p = n => String(n).padStart(2, '0');
    return { main: (h ? h + ':' : '') + p(m) + ':' + p(s), ms: '.' + p(cs) };
  }

  function render() {
    const t = format(now());
    display.innerHTML = t.main + '<span class="ms">' + t.ms + '</span>';
    if (running) rafId = requestAnimationFrame(render);
  }

  function renderLaps() {
    lapList.innerHTML = '';
    const min = laps.length > 1 ? Math.min(...laps) : null;
    const max = laps.length > 1 ? Math.max(...laps) : null;
    let total = 0;
    const rows = laps.map((d, i) => {
      total += d;
      const li = document.createElement('li');
      if (d === min) li.className = 'best';
      else if (d === max) li.className = 'worst';
      const t = format(d), tt = format(total);
      li.innerHTML = '<span>기다려 ' + (i + 1) + '</span>' +
        '<span class="total">' + tt.main + tt.ms + '</span>' +
        '<span>' + t.main + t.ms + '</span>';
      return li;
    });
    rows.reverse().forEach(li => lapList.appendChild(li));
  }

  function updateButtons() {
    toggleBtn.textContent = running ? '정지' : '출발';
    toggleBtn.className = running ? 'stop' : 'start';
    lapBtn.textContent = running || elapsed === 0 ? '기다려' : '리셋';
    lapBtn.disabled = !running && elapsed === 0;
  }

  function toggle() {
    if (running) {
      elapsed = now();
      running = false;
      cancelAnimationFrame(rafId);
      render();
    } else {
      startTime = performance.now();
      running = true;
      if (window.snailRace) window.snailRace.start();   // 출발선의 달팽이들 출발
      render();
    }
    updateButtons();
  }

  function lap() {
    if (!running) return;
    const t = now();
    laps.push(t - lastLapTotal);
    lastLapTotal = t;
    renderLaps();
    const f = format(t);
    if (window.snailRace) window.snailRace.freezeRandom(f.main + f.ms);
  }

  function reset() {
    if (running) return;
    elapsed = 0; laps = []; lastLapTotal = 0;
    if (window.snailRace) window.snailRace.reset();   // 멈춘 달팽이들 다시 출발
    render(); renderLaps(); updateButtons();
  }

  toggleBtn.addEventListener('click', toggle);
  lapBtn.addEventListener('click', () => running ? lap() : reset());

  document.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'l' || e.key === 'L') lap();
    else if (e.key === 'r' || e.key === 'R') reset();
  });
})();
</script>
